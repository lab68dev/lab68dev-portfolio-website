<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0c0a1f;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b5cf6" opacity="0.2"/>
    </pattern>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad3)" />
  <rect width="100%" height="100%" fill="url(#dots)" />
  
  <!-- Document Pages -->
  <g stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.8" filter="url(#glow2)">
    <rect x="280" y="100" width="240" height="250" rx="4" fill="#1e1b4b" opacity="0.3" />
    <rect x="300" y="120" width="200" height="210" rx="2" stroke-width="1.5" />
    
    <!-- Document Lines -->
    <line x1="320" y1="150" x2="480" y2="150" stroke="#a78bfa" opacity="0.6" />
    <line x1="320" y1="170" x2="450" y2="170" stroke="#a78bfa" opacity="0.6" />
    <line x1="320" y1="190" x2="470" y2="190" stroke="#a78bfa" opacity="0.4" />
    <line x1="320" y1="210" x2="430" y2="210" stroke="#a78bfa" opacity="0.4" />
    <line x1="320" y1="230" x2="460" y2="230" stroke="#a78bfa" opacity="0.4" />
    <line x1="320" y1="250" x2="440" y2="250" stroke="#a78bfa" opacity="0.4" />
    
    <!-- Profile Circle -->
    <circle cx="360" cy="140" r="12" stroke="#8b5cf6" stroke-width="2" />
  </g>
  
  <!-- Corner Markers -->
  <g stroke="#8b5cf6" stroke-width="3" opacity="0.6">
    <path d="M 260 80 L 260 100 L 280 100" />
    <path d="M 540 80 L 540 100 L 520 100" />
    <path d="M 260 370 L 260 350 L 280 350" />
    <path d="M 540 370 L 540 350 L 520 350" />
  </g>

  <text x="400" y="240" font-family="monospace" font-size="24" fill="#8b5cf6" text-anchor="middle" font-weight="bold" opacity="0.9" filter="url(#glow2)">CV BUILDER</text>
  <text x="400" y="270" font-family="monospace" font-size="12" fill="#c4b5fd" text-anchor="middle" letter-spacing="4">CREATE & EXPORT</text>
</svg>
